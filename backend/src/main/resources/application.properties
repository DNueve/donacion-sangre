
spring.application.name=api-banco-sangre
server.port=${PORT:8081}
# =============================================
# SUPABASE - TALLER2_FINAL (Pooler IPv4)
# =============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT
# =============================================
#jwt.secret=miClaveSecretaBancoSangre2026ConMinimo32Caracteres
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


# =============================================
# GROQ API
# =============================================
#groq.api.key=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
groq.api.key=${GROQ_API_KEY}